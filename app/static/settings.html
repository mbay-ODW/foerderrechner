<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B6E7F">
  <title>Einstellungen — Förderrechner</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1>Einstellungen</h1>
        <p class="sub">Branding für Oberfläche und PDF-Export.</p>
      </div>
      <a href="/" class="icon-btn" title="Zurück" aria-label="Zurück zum Rechner">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </header>

    <section class="card">
      <h2>Firma & Kontakt</h2>
      <p class="muted small">Erscheint im Header und in der Fußzeile des PDF-Exports.</p>

      <label>
        <span>Firmenname</span>
        <input id="firmenname" type="text" placeholder="Energieberatung Mustermann" />
      </label>
      <label>
        <span>Adresse</span>
        <input id="kontakt-adresse" type="text" placeholder="Musterstraße 1, 12345 Musterstadt" />
      </label>
      <div class="row-3">
        <label>
          <span>Telefon</span>
          <input id="kontakt-telefon" type="text" placeholder="+49 …" />
        </label>
        <label>
          <span>E-Mail</span>
          <input id="kontakt-email" type="email" placeholder="info@…" />
        </label>
        <label>
          <span>Akzentfarbe</span>
          <input id="akzentfarbe" type="color" value="#0B6E7F" />
        </label>
      </div>

      <div class="row">
        <button id="btn-save-general" class="primary">Speichern</button>
      </div>
    </section>

    <section class="card">
      <h2>Logo</h2>
      <p class="muted small">Wird im Header und im PDF-Export angezeigt. PNG, JPG, SVG oder WebP, max. 2 MB.</p>

      <div id="logo-preview-wrap" class="logo-preview-wrap hidden">
        <img id="logo-preview" src="" alt="Logo" class="logo-preview-img" />
        <button id="btn-delete-logo" class="secondary small danger" type="button">Logo entfernen</button>
      </div>

      <div id="logo-upload-zone" class="upload-zone">
        <input type="file" id="logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden />
        <p><strong>Logo hier ablegen</strong> oder <span class="linklike" id="btn-pick-logo">Datei wählen</span></p>
        <small class="muted">PNG · JPG · SVG · WebP — max. 2 MB</small>
      </div>
      <div id="logo-status" class="hidden" style="margin-top:8px;"></div>
    </section>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p id="loading-text">Lade…</p>
    </div>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="/settings.js"></script>
</body>
</html>
